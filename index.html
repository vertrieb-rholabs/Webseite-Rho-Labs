<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04070f" />
    <!--
      Titel und Beschreibung setzt jede Seite selbst über <Seo>; hier stünden
      sie sonst ein zweites Mal im ausgelieferten HTML.
    -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!--
      Schriften liegen unter /fonts und werden von der eigenen Domain geladen.
      Kein Google-Fonts-CDN: die Datenschutzerklärung nennt keinen solchen
      Empfänger, und beim Abruf würde die IP-Adresse des Besuchers dorthin
      übertragen. Die beiden Schnitte im ersten Bildschirm werden vorgeladen.
    -->
    <link
      rel="preload"
      href="/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/dmsans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="module" crossorigin src="/src/index.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
